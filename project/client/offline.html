<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#142027">
  <link rel="icon" href="data:,">
  <title>Lilium Moonlight · Сервер недоступен</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 1rem;
      background: #142027; color: #fbf7ed; font: 1rem/1.5 system-ui,sans-serif; }
    main { width: min(100%, 27rem); padding: 1.4rem; background: #1b3540; border: 1px solid #607078; border-radius: .7rem; }
    h1 { margin: 0; font-size: 1.3rem; }
    button { min-height: 44px; padding: .6rem .8rem; border: 0; border-radius: .4rem; background: #f0d297;
      color: #18272e; font: inherit; font-weight: 650; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Сервер Lilium Moonlight недоступен</h1>
    <p>Страница игры откроется, когда сервер снова ответит.</p>
    <button id="retry" type="button">Повторить подключение</button>
  </main>
  <script>
    if (['/','/index.html','/client/index.html'].includes(location.pathname)) {
      try {
        const key='honeymoon-startup-diagnostics:v1';
        const stored=JSON.parse(localStorage.getItem(key));
        const entries=(Array.isArray(stored)?stored:[]).slice(-31);
        const attempt=Array.from(crypto.getRandomValues(new Uint8Array(8)),byte=>byte.toString(16).padStart(2,'0')).join('');
        const route=['localhost','127.0.0.1','[::1]'].includes(location.hostname)?'local':location.port==='8443'?'compare':'primary';
        entries.push({kind:'startup_phase',id:`${attempt}.0`,phase:'document',outcome:'failed',at:Date.now(),
          durationMs:Math.round(performance.now()),why:navigator.onLine===false?'offline':'unavailable',route});
        localStorage.setItem(key,JSON.stringify(entries));
      } catch { /* the fallback page stays usable without local storage */ }
    }
    document.getElementById('retry').addEventListener('click',()=>location.reload());
    async function reconnect() {
      try {
        const response=await fetch('/api/ping',{cache:'no-store',signal:AbortSignal.timeout(3500)});
        if (response.status===204) location.reload();
      } catch {}
    }
    addEventListener('online',reconnect);
    setInterval(reconnect,5000);
  </script>
</body>
</html>
